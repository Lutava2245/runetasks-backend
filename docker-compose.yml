services:
  db:
    image: mysql:8.0
    volumes:
      - ./mysql_data:/var/lib/mysql:Z
    container_name: runetasks-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: runetasksDB
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: runetasks-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/runetasksDB
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      - db
